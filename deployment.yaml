apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-results-archiver
  labels:
    app: ci-results-archiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-results-archiver
  # Default RollingUpdate strategy doesn't work with 1 replica deployments.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ci-results-archiver
    spec:
      containers:
      - name: ci-results-archiver
        image: gcr.io/google.com/chromeos-lab/ci_results_archiver@sha256:2af96dcca4eda8ed26a3322bb4da59055903f1d3ff2a94d999fe9e2817a7574d
        env:
        - name: PYTHONPATH
          value: "/ci_results_archiver"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/secrets/main-service-account-key/service_account.json"
        command: ["python"]
        args: [
          "/ci_results_archiver/ci_results_archiver/main.py",
          "-c=/mysql-config/config",
          "--run-soon",
        ]
        volumeMounts:
        - name: main-service-account-key
          mountPath: '/secrets/main-service-account-key'
          readOnly: true
        - name: mysql-config
          mountPath: '/mysql-config'
          readOnly: true
      volumes:
      - name: main-service-account-key
        secret:
          secretName: main-service-account-key
      - name: mysql-config
        secret:
          secretName: mysql-config
